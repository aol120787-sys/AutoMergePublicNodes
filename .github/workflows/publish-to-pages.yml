name: Fetch and Publish to Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # 每 3 小时运行一次（可改）
  push:
    paths:
      - '**.py'
      - 'sources.list'
      - 'config.yml'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script (generate subscription files)
        run: python ./fetch.py

      - name: Prepare public directory
        run: |
          rm -rf public
          mkdir -p public
          cp -f list.txt public/ || true
          cp -f list.yml public/ || true
          cp -f list.meta.yml public/ || true
          cp -f list_raw.txt public/ || true
          cp -r snippets public/ || true
          ls -R public

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
